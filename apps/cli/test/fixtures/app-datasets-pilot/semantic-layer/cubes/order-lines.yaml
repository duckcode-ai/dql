name: order_lines
label: Order lines semantic model
description: Native semantic source over the same live order-line relation as the certified block Dataset.
domain: commerce
table: order_lines
sql: SELECT * FROM order_lines
measures:
  - name: semantic_revenue
    label: Revenue
    description: Net revenue from complete order-line rows.
    sql: SUM(net_amount)
    type: sum
    aggregation: sum
    agg_time_dimension: order_date
  - name: semantic_margin_amount
    label: Margin amount
    description: Net margin from complete order-line rows.
    sql: SUM(margin_amount)
    type: sum
    aggregation: sum
    agg_time_dimension: order_date
  - name: semantic_order_count
    label: Distinct orders
    description: Distinct order count recomputed from complete order-line rows.
    sql: COUNT(DISTINCT order_id)
    type: count_distinct
    aggregation: count_distinct
    agg_time_dimension: order_date
  - name: semantic_customer_count
    label: Distinct customers
    description: Distinct customer count recomputed from complete order-line rows.
    sql: COUNT(DISTINCT customer_id)
    type: count_distinct
    aggregation: count_distinct
    agg_time_dimension: order_date
dimensions:
  - name: order_id
    label: Order ID
    description: Source order identity.
    sql: order_id
    type: string
  - name: customer_id
    label: Customer ID
    description: Source customer identity.
    sql: customer_id
    type: string
  - name: region
    label: Region
    description: Sales region.
    sql: region
    type: string
time_dimensions:
  - name: order_date
    label: Order date
    description: Event time for the order line.
    sql: order_date
    granularities: [day, month]
    primary_time: true
