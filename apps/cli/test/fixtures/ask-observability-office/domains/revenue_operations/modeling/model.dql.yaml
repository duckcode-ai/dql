  - id: competitor_observation_to_lost_opportunity
    from: competitor_observation
    to: lost_opportunity
    verb: may reference
    description: Deliberately un-attributed relationship for unsafe-join denial coverage.
    keys: [{ from: opportunity_id, to: opportunity_id }]
